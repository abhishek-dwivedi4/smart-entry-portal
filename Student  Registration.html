 <!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Registration + Complete Profile</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root{
      --primary:#0f62fe;
      --primary-dark:#0b4fd1;
      --secondary:#eef4ff;
      --surface:#ffffff;
      --surface-2:#f8fbff;
      --line:#d9e4f5;
      --text:#0f172a;
      --muted:#5b6b86;
      --success:#16a34a;
      --danger:#dc3545;
      --info:#2563eb;
      --shadow-sm:0 8px 22px rgba(15,98,254,.08);
      --shadow-md:0 18px 40px rgba(15,98,254,.12);
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Segoe UI',sans-serif;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      min-height:100vh;
      margin:0;
      color:var(--text);
      background:
        radial-gradient(circle at top left, rgba(15,98,254,.12), transparent 25%),
        radial-gradient(circle at bottom right, rgba(96,165,250,.10), transparent 18%),
        linear-gradient(180deg,#f7fbff 0%,#eef4ff 100%);
      overflow-x:hidden;
    }

    img{
      max-width:100%;
      height:auto;
      display:block;
    }

    .topbar{
      background:rgba(255,255,255,.82);
      backdrop-filter: blur(12px);
      color:var(--text);
      padding:14px 22px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      font-weight:800;
      flex-wrap:wrap;
      gap:10px;
      border-bottom:1px solid var(--line);
      box-shadow:var(--shadow-sm);
      position:relative;
      z-index:2;
    }

    .brand-left{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:0;
    }

    .brand-left img{
      width:42px;
      height:42px;
      object-fit:contain;
      border-radius:12px;
      background:#fff;
      padding:5px;
      border:1px solid var(--line);
      box-shadow:var(--shadow-sm);
      flex-shrink:0;
    }

    .brand-left span{
      font-size:15px;
      font-weight:900;
      letter-spacing:.3px;
      white-space:nowrap;
      color:#163469;
    }

    .top-actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .home-btn{
      border:none;
      padding:10px 16px;
      border-radius:999px;
      background:linear-gradient(135deg,var(--primary),var(--primary-dark));
      color:#fff;
      font-weight:800;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      box-shadow:0 10px 22px rgba(15,98,254,.18);
      text-align:center;
      transition:.2s ease;
    }

    .home-btn:hover{
      color:#fff;
      transform:translateY(-1px);
    }

    .page-wrap{
      flex:1;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px 14px;
    }

    .wrap{
      width:100%;
      max-width:760px;
      background:rgba(255,255,255,.92);
      border:1px solid var(--line);
      backdrop-filter:blur(10px);
      border-radius:24px;
      padding:24px 22px;
      box-shadow:var(--shadow-md);
    }

    .logo-top{
      text-align:center;
      margin-bottom:10px;
    }

    .logo-top img{
      width:64px;
      height:64px;
      object-fit:contain;
      border-radius:16px;
      background:#fff;
      padding:6px;
      border:1px solid var(--line);
      box-shadow:var(--shadow-sm);
      margin:0 auto;
    }

    .main-title{
      text-align:center;
      font-size:24px;
      font-weight:900;
      color:#163469;
      margin-bottom:4px;
      line-height:1.2;
    }

    .sub-title{
      text-align:center;
      font-size:13px;
      color:var(--muted);
      margin-bottom:14px;
      font-weight:600;
      line-height:1.6;
    }

    .step-indicator{
      display:flex;
      justify-content:center;
      gap:10px;
      margin-bottom:18px;
      flex-wrap:wrap;
    }

    .step-pill{
      padding:7px 13px;
      border-radius:999px;
      font-size:12px;
      font-weight:800;
      border:1px solid #d9e4f5;
      color:var(--primary);
      background:#eef4ff;
      text-align:center;
    }

    .step-pill.active{
      background:linear-gradient(135deg,var(--primary),var(--primary-dark));
      color:#fff;
      border-color:transparent;
    }

    .step-pill.done{
      background:linear-gradient(135deg,#22c55e,#16a34a);
      color:#fff;
      border-color:transparent;
    }

    .row-gap{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    .field-card{
      background:none;
      border:none;
      padding:4px;
      margin-bottom:4px;
      min-width:0;
    }

    .field-card.full{
      grid-column:1 / -1;
    }

    .form-label{
      font-size:12px;
      font-weight:800;
      color:#294066;
      margin-bottom:5px;
      display:block;
    }

    .input-box,
    .text-box,
    .file-box{
      width:100%;
      border-radius:12px;
      padding:11px 13px;
      font-size:13px;
      font-weight:700;
      color:#0f172a;
      background:#fff;
      border:1px solid #d7e3f7;
      outline:none;
      transition:.2s ease;
    }

    .input-box:focus,
    .text-box:focus,
    .file-box:focus{
      border-color:#8bb5ff;
      box-shadow:0 0 0 .2rem rgba(15,98,254,.10);
    }

    .text-box{
      min-height:92px;
      resize:vertical;
    }

    .readonly{
      background:#f1f5f9;
      cursor:not-allowed;
      color:#64748b;
    }

    .btn-main,
    .btn-back,
    .btn-next{
      width:100%;
      border:none;
      cursor:pointer;
      font-weight:900;
      transition:.2s ease;
    }

    .btn-main,
    .btn-next{
      padding:12px;
      font-size:14px;
      color:#fff;
      border-radius:12px;
      background:linear-gradient(135deg,var(--primary),var(--primary-dark));
      margin-top:12px;
      box-shadow:0 12px 24px rgba(15,98,254,.18);
    }

    .btn-main:hover,
    .btn-next:hover{
      transform:translateY(-1px);
    }

    .btn-main:disabled,
    .btn-next:disabled,
    .btn-back:disabled{
      opacity:.75;
      cursor:not-allowed;
      transform:none;
    }

    .btn-back{
      padding:11px;
      font-size:13px;
      color:#fff;
      border-radius:12px;
      background:linear-gradient(135deg,#ef4444,#dc2626);
      margin-top:10px;
    }

    .note-box{
      margin-top:14px;
      text-align:center;
      font-size:12px;
      font-weight:700;
      color:#5b6b86;
      background:#f8fbff;
      padding:10px 12px;
      border-radius:12px;
      border:1px solid #e2ebfa;
      line-height:1.6;
    }

    .loading-text{
      display:none;
      text-align:center;
      margin-top:12px;
      color:#163469;
      font-weight:700;
      font-size:13px;
    }

    .hidden{
      display:none !important;
    }

    .file-name{
      margin-top:8px;
      font-size:12px;
      color:#5b6b86;
      font-weight:700;
      word-break:break-word;
    }

    .popup-overlay{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.45);
      display:flex;
      align-items:center;
      justify-content:center;
      opacity:0;
      visibility:hidden;
      transition:.25s ease;
      z-index:9999;
      padding:20px;
    }

    .popup-overlay.show{
      opacity:1;
      visibility:visible;
    }

    .popup-box{
      width:100%;
      max-width:430px;
      background:#fff;
      border-radius:22px;
      padding:24px 20px;
      text-align:center;
      box-shadow:0 20px 50px rgba(0,0,0,.25);
      border:1px solid var(--line);
    }

    .popup-icon{
      width:68px;
      height:68px;
      border-radius:50%;
      margin:0 auto 14px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:32px;
      font-weight:900;
      color:#fff;
    }

    .popup-success .popup-icon{background:linear-gradient(135deg,#22c55e,#16a34a)}
    .popup-error .popup-icon{background:linear-gradient(135deg,#ef4444,#dc2626)}
    .popup-info .popup-icon{background:linear-gradient(135deg,#0ea5e9,#2563eb)}

    .popup-title{
      font-size:22px;
      font-weight:900;
      color:#0f172a;
      margin-bottom:8px;
    }

    .popup-message{
      font-size:14px;
      color:#475569;
      line-height:1.5;
      margin-bottom:16px;
      font-weight:600;
      white-space:pre-line;
    }

    .popup-btn{
      border:none;
      padding:11px 20px;
      border-radius:12px;
      color:#fff;
      font-weight:800;
      font-size:14px;
      cursor:pointer;
      background:linear-gradient(135deg,#0f62fe,#0b4fd1);
    }

    @media(max-width:768px){
      .row-gap{
        grid-template-columns:1fr;
      }

      .wrap{
        padding:20px 14px;
      }

      .main-title{
        font-size:20px;
      }

      .brand-left{
        width:100%;
      }

      .brand-left img{
        width:36px;
        height:36px;
      }

      .brand-left span{
        font-size:13px;
      }

      .top-actions{
        width:100%;
      }

      .top-actions .home-btn{
        width:100%;
      }

      .step-pill{
        font-size:11px;
        padding:6px 10px;
      }
    }

    @media(max-width:480px){
      .topbar{
        padding:12px;
      }

      .page-wrap{
        padding:16px 10px;
      }

      .wrap{
        padding:16px 12px;
        border-radius:20px;
      }

      .popup-box{
        padding:20px 16px;
      }

      .popup-title{
        font-size:20px;
      }
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="brand-left">
      <img src="logo.png" alt="Smart Entry Logo">
      <span>SMART ENTRY PORTAL</span>
    </div>

    <div class="top-actions">
      <a href="index3.html" class="home-btn">HOME</a>
    </div>
  </div>

  <div class="page-wrap">
    <div class="wrap">
      <div class="logo-top">
        <img src="logo.png" alt="Smart Entry Logo">
      </div>

      <h1 class="main-title">Student Registration Portal</h1>
      <p class="sub-title">Register student basic details and complete profile</p>

      <div class="step-indicator">
        <div id="stepPill1" class="step-pill active">Step 1 - Basic Details</div>
        <div id="stepPill2" class="step-pill">Step 2 - Complete Profile</div>
      </div>

      <div id="step1Box">
        <div class="row-gap">
          <div class="field-card full">
            <label class="form-label">Full Name</label>
            <input type="text" id="name" class="input-box" placeholder="Enter full name">
          </div>

          <div class="field-card">
            <label class="form-label">Roll Number</label>
            <input type="text" id="rollNo" class="input-box" placeholder="Enter roll number">
          </div>

          <div class="field-card">
            <label class="form-label">Phone Number</label>
            <input type="text" id="phone" class="input-box" placeholder="Enter 10 digit phone">
          </div>

          <div class="field-card">
            <label class="form-label">Branch</label>
            <input type="text" id="branch" class="input-box" placeholder="Enter branch">
          </div>

          <div class="field-card">
            <label class="form-label">Year</label>
            <input type="text" id="year" class="input-box" placeholder="Enter year">
          </div>

          <div class="field-card">
            <label class="form-label">Room</label>
            <input type="text" id="room" class="input-box" placeholder="Enter room number">
          </div>

          <div class="field-card">
            <label class="form-label">Hostel</label>
            <input type="text" id="hostel" class="input-box" placeholder="Enter hostel name">
          </div>
        </div>

        <button type="button" id="saveBasicBtn" class="btn-next">Save Basic Detail</button>
        <button type="button" id="backBtn1" class="btn-back">Back</button>

        <div class="loading-text" id="loadingText1">Saving basic details...</div>
      </div>

      <div id="step2Box" class="hidden">
        <div class="row-gap">
          <div class="field-card">
            <label class="form-label">Roll Number</label>
            <input type="text" id="s2_rollNo" class="input-box readonly" readonly>
          </div>

          <div class="field-card">
            <label class="form-label">Full Name</label>
            <input type="text" id="s2_name" class="input-box readonly" readonly>
          </div>

          <div class="field-card">
            <label class="form-label">Student Phone Number</label>
            <input type="text" id="s2_phone" class="input-box readonly" readonly>
          </div>

          <div class="field-card">
            <label class="form-label">Branch</label>
            <input type="text" id="s2_branch" class="input-box readonly" readonly>
          </div>

          <div class="field-card">
            <label class="form-label">Year</label>
            <input type="text" id="s2_year" class="input-box readonly" readonly>
          </div>

          <div class="field-card">
            <label class="form-label">Room</label>
            <input type="text" id="s2_room" class="input-box readonly" readonly>
          </div>

          <div class="field-card">
            <label class="form-label">Hostel</label>
            <input type="text" id="s2_hostel" class="input-box readonly" readonly>
          </div>

          <div class="field-card full">
            <label class="form-label">Address</label>
            <textarea id="address" class="text-box" placeholder="Enter address"></textarea>
          </div>

          <div class="field-card">
            <label class="form-label">State</label>
            <input type="text" id="state" class="input-box" placeholder="Enter state">
          </div>

          <div class="field-card">
            <label class="form-label">District</label>
            <input type="text" id="district" class="input-box" placeholder="Enter district">
          </div>

          <div class="field-card">
            <label class="form-label">City</label>
            <input type="text" id="city" class="input-box" placeholder="Enter city">
          </div>

          <div class="field-card">
            <label class="form-label">Pincode</label>
            <input type="text" id="pincode" class="input-box" placeholder="Enter pincode">
          </div>

          <div class="field-card">
            <label class="form-label">Father Name</label>
            <input type="text" id="fatherName" class="input-box" placeholder="Enter father name">
          </div>

          <div class="field-card">
            <label class="form-label">Mother Name</label>
            <input type="text" id="motherName" class="input-box" placeholder="Enter mother name">
          </div>

          <div class="field-card">
            <label class="form-label">Guardian Name</label>
            <input type="text" id="guardianName" class="input-box" placeholder="Enter guardian name">
          </div>

          <div class="field-card">
            <label class="form-label">Guardian Phone</label>
            <input type="text" id="guardianPhone" class="input-box" placeholder="Enter guardian phone">
          </div>

          <div class="field-card">
            <label class="form-label">Emergency Phone No.</label>
            <input type="text" id="emergencyPhone" class="input-box" placeholder="Enter emergency phone">
          </div>

          <div class="field-card">
            <label class="form-label">Blood Group</label>
            <input type="text" id="bloodGroup" class="input-box" placeholder="Enter blood group">
          </div>

          <div class="field-card full">
            <label class="form-label">Medical Condition</label>
            <textarea id="medicalCondition" class="text-box" placeholder="Enter medical condition"></textarea>
          </div>

          <div class="field-card">
            <label class="form-label">Parent Email</label>
            <input type="email" id="parentEmail" class="input-box" placeholder="Enter parent email">
          </div>

          <div class="field-card">
            <label class="form-label">Student Email</label>
            <input type="email" id="studentEmail" class="input-box" placeholder="Enter student email">
          </div>

          <div class="field-card">
            <label class="form-label">Photo File</label>
            <input type="file" id="photoFile" class="file-box" accept="image/*">
            <div id="photoFileName" class="file-name">No file selected</div>
          </div>

          <div class="field-card">
            <label class="form-label">Document File</label>
            <input type="file" id="documentsFile" class="file-box" accept=".pdf,.jpg,.jpeg,.png,.doc,.docx">
            <div id="documentsFileName" class="file-name">No file selected</div>
          </div>
        </div>

        <button type="button" id="saveProfileBtn" class="btn-main">Save Complete Profile</button>
        <button type="button" id="backBtn2" class="btn-back">Back</button>

        <div class="loading-text" id="loadingText2">Saving complete profile...</div>
      </div>
    </div>
  </div>

  <div id="popupOverlay" class="popup-overlay">
    <div id="popupBox" class="popup-box popup-info">
      <div class="popup-icon">i</div>
      <div id="popupTitle" class="popup-title">Info</div>
      <div id="popupMessage" class="popup-message">Message</div>
      <button id="popupBtn" class="popup-btn" type="button">OK</button>
    </div>
  </div>

<script>
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzPHAnb85VNjt9C_HngDf-KXTyECCC7QlJKxvCevx4-AchwK1APRAiAsWYad7vYXfOz/exec";

  function showPopup(type, title, message, cb = null) {
    const overlay = document.getElementById("popupOverlay");
    const box = document.getElementById("popupBox");
    const icon = box.querySelector(".popup-icon");

    box.className = "popup-box " + (type === "success" ? "popup-success" : type === "error" ? "popup-error" : "popup-info");
    icon.textContent = type === "success" ? "✓" : type === "error" ? "!" : "i";
    document.getElementById("popupTitle").textContent = title;
    document.getElementById("popupMessage").textContent = message;
    overlay.classList.add("show");

    document.getElementById("popupBtn").onclick = function() {
      overlay.classList.remove("show");
      if (cb) cb();
    };
  }

  async function safeJson(r) {
    const txt = await r.text();
    try {
      return JSON.parse(txt);
    } catch (e) {
      return { ok: false, message: "Server non-JSON response", raw: txt };
    }
  }

  function setStep(step) {
    document.getElementById("step1Box").classList.toggle("hidden", step !== 1);
    document.getElementById("step2Box").classList.toggle("hidden", step !== 2);

    document.getElementById("stepPill1").className = "step-pill" + (step === 1 ? " active" : " done");
    document.getElementById("stepPill2").className = "step-pill" + (step === 2 ? " active" : "");
  }

  function fillStep2Basic(data) {
    document.getElementById("s2_rollNo").value = data.rollNo || "";
    document.getElementById("s2_name").value = data.name || "";
    document.getElementById("s2_phone").value = data.phone || "";
    document.getElementById("s2_branch").value = data.branch || "";
    document.getElementById("s2_year").value = data.year || "";
    document.getElementById("s2_room").value = data.room || "";
    document.getElementById("s2_hostel").value = data.hostel || "";
  }

  function readFileAsBase64(file) {
    return new Promise((resolve, reject) => {
      if (!file) {
        resolve(null);
        return;
      }
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function validateStep1() {
    const name = document.getElementById("name").value.trim();
    const rollNo = document.getElementById("rollNo").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const branch = document.getElementById("branch").value.trim();
    const year = document.getElementById("year").value.trim();
    const room = document.getElementById("room").value.trim();
    const hostel = document.getElementById("hostel").value.trim();

    if (!name) return "Full name required";
    if (!rollNo) return "Roll number required";
    if (!phone) return "Phone number required";
    if (!branch) return "Branch required";
    if (!year) return "Year required";
    if (!room) return "Room required";
    if (!hostel) return "Hostel required";

    return "";
  }

  function validateStep2() {
    const address = document.getElementById("address").value.trim();
    const state = document.getElementById("state").value.trim();
    const district = document.getElementById("district").value.trim();
    const city = document.getElementById("city").value.trim();
    const pincode = document.getElementById("pincode").value.trim();
    const fatherName = document.getElementById("fatherName").value.trim();
    const emergencyPhone = document.getElementById("emergencyPhone").value.trim();
    const parentEmail = document.getElementById("parentEmail").value.trim();
    const studentEmail = document.getElementById("studentEmail").value.trim();

    if (!address) return "Address required";
    if (!state) return "State required";
    if (!district) return "District required";
    if (!city) return "City required";
    if (!pincode) return "Pincode required";
    if (!fatherName) return "Father name required";
    if (!emergencyPhone) return "Emergency phone required";
    if (!parentEmail) return "Parent email required";
    if (!studentEmail) return "Student email required";

    return "";
  }

  async function saveBasicDetail() {
    const err = validateStep1();
    if (err) {
      showPopup("error", "Validation Error", err);
      return;
    }

    const btn = document.getElementById("saveBasicBtn");
    const loading = document.getElementById("loadingText1");

    btn.disabled = true;
    loading.style.display = "block";

    try {
      const payload = {
        action: "registerStudentBasic",
        data: {
          name: document.getElementById("name").value.trim(),
          rollNo: document.getElementById("rollNo").value.trim(),
          phone: document.getElementById("phone").value.trim(),
          branch: document.getElementById("branch").value.trim(),
          year: document.getElementById("year").value.trim(),
          room: document.getElementById("room").value.trim(),
          hostel: document.getElementById("hostel").value.trim()
        }
      };

      const r = await fetch(WEB_APP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });

      const res = await safeJson(r);

      if (!res.ok) {
        showPopup("error", "Failed", res.message || "Basic detail save failed");
        return;
      }

      fillStep2Basic(payload.data);
      setStep(2);
      showPopup("success", "Success", res.message || "Basic detail saved successfully");

    } catch (err2) {
      showPopup("error", "Error", "Basic detail save failed");
    } finally {
      btn.disabled = false;
      loading.style.display = "none";
    }
  }

  async function saveCompleteProfile() {
    const err = validateStep2();
    if (err) {
      showPopup("error", "Validation Error", err);
      return;
    }

    const btn = document.getElementById("saveProfileBtn");
    const loading = document.getElementById("loadingText2");

    btn.disabled = true;
    loading.style.display = "block";

    try {
      const photoFile = document.getElementById("photoFile").files[0] || null;
      const documentsFile = document.getElementById("documentsFile").files[0] || null;

      const photoBase64 = await readFileAsBase64(photoFile);
      const documentBase64 = await readFileAsBase64(documentsFile);

      const payload = {
        action: "saveCompleteProfile",
        data: {
          rollNo: document.getElementById("s2_rollNo").value.trim(),
          address: document.getElementById("address").value.trim(),
          state: document.getElementById("state").value.trim(),
          district: document.getElementById("district").value.trim(),
          city: document.getElementById("city").value.trim(),
          pincode: document.getElementById("pincode").value.trim(),
          fatherName: document.getElementById("fatherName").value.trim(),
          motherName: document.getElementById("motherName").value.trim(),
          guardianName: document.getElementById("guardianName").value.trim(),
          guardianPhone: document.getElementById("guardianPhone").value.trim(),
          emergencyPhone: document.getElementById("emergencyPhone").value.trim(),
          bloodGroup: document.getElementById("bloodGroup").value.trim(),
          medicalCondition: document.getElementById("medicalCondition").value.trim(),
          parentEmail: document.getElementById("parentEmail").value.trim(),
          studentEmail: document.getElementById("studentEmail").value.trim(),

          photoBase64: photoBase64 || "",
          photoName: photoFile ? photoFile.name : "",
          photoMimeType: photoFile ? photoFile.type : "",

          documentBase64: documentBase64 || "",
          documentName: documentsFile ? documentsFile.name : "",
          documentMimeType: documentsFile ? documentsFile.type : ""
        }
      };

      const r = await fetch(WEB_APP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });

      const res = await safeJson(r);

      if (!res.ok) {
        showPopup("error", "Failed", res.message || "Complete profile save failed");
        return;
      }

      showPopup("success", "Success", res.message || "Complete profile saved successfully", () => {
        window.location.href = "index3.html";
      });

    } catch (err2) {
      showPopup("error", "Error", "Complete profile save failed");
    } finally {
      btn.disabled = false;
      loading.style.display = "none";
    }
  }

  document.getElementById("saveBasicBtn").addEventListener("click", saveBasicDetail);
  document.getElementById("saveProfileBtn").addEventListener("click", saveCompleteProfile);

  document.getElementById("backBtn1").addEventListener("click", function() {
    window.location.href = "index3.html";
  });

  document.getElementById("backBtn2").addEventListener("click", function() {
    setStep(1);
  });

  document.getElementById("photoFile").addEventListener("change", function() {
    const file = this.files[0];
    document.getElementById("photoFileName").textContent = file ? file.name : "No file selected";
  });

  document.getElementById("documentsFile").addEventListener("change", function() {
    const file = this.files[0];
    document.getElementById("documentsFileName").textContent = file ? file.name : "No file selected";
  });
</script>

</body>
</html>
